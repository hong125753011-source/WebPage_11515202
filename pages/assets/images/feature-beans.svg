<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 300" width="100%" height="100%" role="img" aria-labelledby="beansTitle">
  <title id="beansTitle">精選咖啡豆</title>
  <defs>
    <linearGradient id="beanBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F6F0"/>
      <stop offset="100%" stop-color="#EFE6DA"/>
    </linearGradient>
  </defs>
  <rect width="400" height="300" rx="14" fill="url(#beanBg)"/>

  <!-- Botanical branch -->
  <path d="M 80 230 Q 180 180, 310 100" stroke="#1F392B" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  <!-- Leaves -->
  <path d="M 140 195 C 120 170, 140 145, 170 160 C 180 180, 160 205, 140 195 Z" fill="#2A4B3A"/>
  <path d="M 210 155 C 235 130, 260 145, 245 175 C 225 185, 200 170, 210 155 Z" fill="#1F392B"/>
  <path d="M 260 120 C 250 90, 280 85, 295 105 C 295 125, 275 135, 260 120 Z" fill="#2A4B3A"/>

  <!-- Coffee Cherries & Roasted Beans -->
  <!-- Red ripe cherries -->
  <circle cx="160" cy="180" r="14" fill="#8C3A27"/>
  <circle cx="180" cy="190" r="13" fill="#A8432D"/>
  <!-- Central large roasted coffee beans -->
  <g transform="translate(195, 150) rotate(-20)" fill="#4A2E1B">
    <ellipse cx="0" cy="0" rx="34" ry="22"/>
    <path d="M -26 0 Q 0 9, 26 0" stroke="#FAF7F2" stroke-width="3" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(245, 195) rotate(35)" fill="#361F10">
    <ellipse cx="0" cy="0" rx="30" ry="20"/>
    <path d="M -22 0 Q 0 -8, 22 0" stroke="#FAF7F2" stroke-width="2.8" fill="none" stroke-linecap="round"/>
  </g>
  <g transform="translate(130, 130) rotate(15)" fill="#5C3B24">
    <ellipse cx="0" cy="0" rx="22" ry="15"/>
    <path d="M -16 0 Q 0 5, 16 0" stroke="#FAF7F2" stroke-width="2.2" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Star / Quality mark -->
  <circle cx="340" cy="65" r="4" fill="#1F392B" opacity="0.6"/>
  <circle cx="355" cy="80" r="2.5" fill="#1F392B" opacity="0.4"/>
</svg>
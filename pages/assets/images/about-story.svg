<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 600 400" width="100%" height="100%" role="img" aria-labelledby="storyTitle storyDesc">
  <title id="storyTitle">晴天咖啡 品牌故事</title>
  <desc id="storyDesc">高山咖啡園與手沖濾滴壺，象徵回歸自然純粹的品牌起點</desc>
  <defs>
    <linearGradient id="storyGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#F9F5EE"/>
      <stop offset="100%" stop-color="#EAE0D0"/>
    </linearGradient>
    <radialGradient id="sunOrigin" cx="28%" cy="30%" r="50%">
      <stop offset="0%" stop-color="#F5E4C4" stop-opacity="0.8"/>
      <stop offset="100%" stop-color="#F5E4C4" stop-opacity="0"/>
    </radialGradient>
  </defs>
  <rect width="600" height="400" rx="16" fill="url(#storyGrad)"/>

  <!-- Morning Sun of Sunny Cafe -->
  <circle cx="160" cy="120" r="70" fill="url(#sunOrigin)"/>
  <circle cx="160" cy="120" r="45" fill="#EAD5B0" opacity="0.5"/>

  <!-- Mountain Silhouettes (Highland origin) -->
  <path d="M 0 280 Q 90 200, 180 250 T 360 210 T 520 260 T 600 230 L 600 400 L 0 400 Z" fill="#D9CCBA" opacity="0.6"/>
  <path d="M 0 310 Q 120 250, 240 285 T 460 270 T 600 290 L 600 400 L 0 400 Z" fill="#C7B6A0" opacity="0.7"/>

  <!-- Forest green coffee trees on ridge -->
  <path d="M 80 340 C 90 315, 110 315, 120 340 Z" fill="#1F392B"/>
  <path d="M 115 345 C 122 325, 138 325, 145 345 Z" fill="#2A4B3A"/>
  <path d="M 140 350 C 148 335, 160 335, 168 350 Z" fill="#1F392B"/>

  <!-- Hand Drip Coffee Kettle & Dripper in foreground -->
  <!-- Pour Over Dripper Server Stand -->
  <g transform="translate(380, 120)">
    <!-- Dripper Filter Cone -->
    <polygon points="50,60 130,60 100,120 80,120" fill="#FAF6EE" stroke="#4A2E1B" stroke-width="2.5"/>
    <polygon points="58,62 122,62 98,110 82,110" fill="#E6D3B6"/>
    <!-- Glass Server Carafe below -->
    <path d="M 75 130 L 115 130 L 135 220 C 135 235, 55 235, 55 220 Z" fill="#FAF6EE" stroke="#4A2E1B" stroke-width="2.5" opacity="0.95"/>
    <!-- Coffee liquid inside carafe -->
    <path d="M 64 180 Q 95 185, 126 180 L 132 216 C 130 228, 60 228, 58 216 Z" fill="#3D2415"/>
    <ellipse cx="95" cy="180" rx="31" ry="5" fill="#6B4423"/>
    <!-- Server handle -->
    <path d="M 130 145 C 160 155, 160 195, 128 205" fill="none" stroke="#4A2E1B" stroke-width="5" stroke-linecap="round"/>
    
    <!-- Drip Drops -->
    <circle cx="90" cy="142" r="3" fill="#6B4423"/>
    <circle cx="90" cy="158" r="3.5" fill="#6B4423"/>
    
    <!-- Kettle Spout pouring water stream -->
    <path d="M -15 80 Q 40 70, 75 80" stroke="#8C5C39" stroke-width="4" fill="none" stroke-linecap="round"/>
    <path d="M 75 80 Q 88 88, 90 98" stroke="#D3C3A8" stroke-width="2.5" fill="none" stroke-linecap="round"/>
  </g>

  <!-- Botanical branch wrapping around right -->
  <path d="M 520 380 Q 550 280, 500 180" stroke="#1F392B" stroke-width="2" fill="none"/>
  <path d="M 520 280 C 540 270, 545 290, 530 300 Z" fill="#1F392B"/>
  <path d="M 505 230 C 485 220, 490 200, 510 215 Z" fill="#2A4B3A"/>
</svg>